
# PV creation 
apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi # dummy, size is elastic
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany  # we can put it as ReadWritemany as well # https://kubernetes.io/docs/concepts/storage/persistent-volumes/ 
  storageClassName: "" # should be empty in static
  persistentVolumeReclaimPolicy: Delete
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0a0c153b5f0d9f697  # this is will take AWS EFS --> file system lo 

---
# PVC creation 
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-static
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""  # bcz static ga chestunam
  volumeName: efs-static
  resources:
    requests:
      storage: 5Gi

---
# POD creation 
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    purpose: efs-static
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1b
  volumes:
  - name: nginx-html
    persistentVolumeClaim:
      claimName: efs-static

---

#Service code 
apiVersion: v1
kind: Service
metadata:
  name: nginx-efs-static-sv
spec:
  type: LoadBalancer
  selector:
    purpose: efs-static
    practice: ebs # created by me
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
      # nodePort: 30007 