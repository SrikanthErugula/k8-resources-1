
# FOR DYNAMIC Creation code

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: roboshop-ebs-sc #04-sc file lo name 
  resources:
    requests:
      storage: 4Gi
# upto here DISK and PV has been created 

---
# POD ki adding above disk
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    purpose: ebs-dynamic-pod
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
  # nodeSelector:   no need enable bcz sc will do autimatic with az 
  #   topology.kubernetes.io/zone: us-east-1b
  volumes:
  - name: nginx-html
    persistentVolumeClaim:
      claimName: ebs-dynamic-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ebs-dynamic-srvc
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-dynamic-pod
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
      nodePort: 30008 # if it is removed no issues