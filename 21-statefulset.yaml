# headless service cl-6
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
  labels:
    app: nginx
    purpose: stateful-demo
spec:
  ports:
  - port: 80
    name: web
  clusterIP: None
  selector:
    app: nginx
    purpose: stateful-demo

---
# ---  Normal service or cluster ip service code 
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
    purpose: stateful-demo
spec:
  ports:
  - port: 80
    name: web
  selector:
    app: nginx
    purpose: stateful-demo


---
# ---stateful set code  cl-6

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app: nginx
      purpose: stateful-demo # has to match .spec.template.metadata.labels
  serviceName: "nginx-headless" # this should be head less service name see above
  replicas: 2 # by default is 1
  template:  # it meas pod create code 
    metadata:
      labels:
        app: nginx
        purpose: stateful-demo # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html

          
  # This is PVC
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs-sc"  # IT WILL BE COMES FROM VOLUME 04-SC
      resources:
        requests:
          storage: 1Gi